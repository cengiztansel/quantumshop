apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  namespace: quantumshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: user-db
          image: postgres:16
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: user-db-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: user-db-storage
          persistentVolumeClaim:
            claimName: user-db-pvc