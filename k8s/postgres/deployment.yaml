apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-db
  namespace: quantumshop

spec:
  replicas: 1
  #strategy:
    #type: Recreate

  selector:
    matchLabels:
      app: product-db

  template:
    metadata:
      labels:
        app: product-db

    spec:
      containers:
        - name: postgres
          image: postgres:16    
          #postgres:16

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc