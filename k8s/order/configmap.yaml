apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: quantumshop
data:
  SPRING_PROFILES_ACTIVE: k8s
  SERVER_PORT: "8084"
  SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
  SPRING_DATASOURCE_USERNAME: cengiz
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_RABBITMQ_HOST: notification-mq
  SPRING_RABBITMQ_PORT: "5672"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:9090/eureka/
  EUREKA_INSTANCE_HOSTNAME: order-service
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
