apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-service
  namespace: quantumshop

spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
      - name: gateway
        image: cengiztansel/gateway-service:v12
        imagePullPolicy: Always

        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8090
          failureThreshold: 60
          periodSeconds: 7
          timeoutSeconds: 7

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8090
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 7
          failureThreshold: 7

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8090
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 7
          failureThreshold: 7

        ports:
          - containerPort: 8090

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        env:
          - name: SPRING_PROFILES_ACTIVE
            valueFrom:
              configMapKeyRef:
                name: gateway-config
                key: SPRING_PROFILES_ACTIVE
          # - name: JAVA_TOOL_OPTIONS
          #   value: "-Xms128m -Xmx256m"
          - name: JWT_ENABLED
            value: "false"
          - name: EUREKA_URL
            valueFrom:
              configMapKeyRef:
                name: gateway-config
                key: EUREKA_URL
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: gateway-jwt-secret
                key: JWT_SECRET
          - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            value: "http://discovery-service:9090/eureka/"
