apiVersion: apps/v1

kind: Deployment

metadata:
  name: notification-mq
  namespace: quantumshop

spec:

  replicas: 1

  selector:

    matchLabels:
      app: rabbitmq

  template:

    metadata:

      labels:
        app: rabbitmq

    spec:

      containers:

      - name: rabbit

        image: rabbitmq:3-management

        ports:

        - containerPort: 5672

        - containerPort: 15672
