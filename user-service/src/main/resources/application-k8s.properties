server.port=8085

#################################################
# PostgreSQL
#################################################
spring.datasource.url=jdbc:postgresql://user-db:5432/user_db

# Kubernetes Secret üzerinden password
spring.datasource.username=${POSTGRES_USERNAME}
# spring.datasource.username=cengiz
spring.datasource.password=${POSTGRES_PASSWORD}
#  spring.datasource.password=password123

spring.jpa.hibernate.ddl-auto=update


#################################################
# Eureka Client
#################################################
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://discovery-service:9090/eureka/
eureka.instance.prefer-ip-address=true

#################################################
# Actuator
#################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.rabbit.enabled=false
management.health.discovery.enabled=false
management.server.port=8081

spring.threads.virtual.enabled=true

