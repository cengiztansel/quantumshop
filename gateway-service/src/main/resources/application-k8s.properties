server.port=8090
#################################################
# Eureka
#################################################
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-service:9090/eureka/}
eureka.instance.prefer-ip-address=true
#################################################
# Gateway Routes
#################################################
# Product Service
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/api/products(?<segment>/?.*),/api/v1/products$\{segment}
# Basket Service
spring.cloud.gateway.server.webmvc.routes[1].id=basket-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BASKET-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/basket/**
# User Service
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[3].id=user-admin
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.server.webmvc.routes[4].id=user-auth
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/auth/**
# Order Service
spring.cloud.gateway.server.webmvc.routes[5].id=order-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/orders/**
#################################################
# Actuator
#################################################
management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webmvc.routes[6].id=order-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/orders/**
