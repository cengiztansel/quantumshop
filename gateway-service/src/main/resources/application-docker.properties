server.port=8090

eureka.client.service-url.defaultZone=http://discovery-service:9090/eureka/

############################################################
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webmvc.routes[3].id=user-admin
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/admin/**

management.endpoints.web.exposure.include=*
