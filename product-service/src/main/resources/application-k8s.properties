#################################################
# Server
#################################################
server.port=8081
spring.application.name=product-service

#################################################
# PostgreSQL
#################################################
spring.datasource.url=jdbc:postgresql://product-db:5432/product_db

# Kubernetes Secret üzerinden password
spring.datasource.username=cengiz
spring.datasource.password=${POSTGRES_PASSWORD}

# Local development alternative
# spring.datasource.username=${POSTGRES_USERNAME}
# spring.datasource.password=password123

#################################################
# Redis
#################################################
spring.data.redis.host=basket-cache
spring.data.redis.port=6379

#################################################
# RabbitMQ
#################################################
spring.rabbitmq.host=notification-mq
spring.rabbitmq.port=5672

#################################################
# Eureka Client
#################################################
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://discovery-service:9090/eureka/
eureka.instance.prefer-ip-address=true

#################################################
# Actuator
#################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.rabbit.enabled=false
management.health.discovery.enabled=false
management.server.port=8081

#################################################
# Logging
#################################################
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
debug=true

SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect