server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: cluster içindeki gateway'e ilet (tarayıcı için aynı origin, CORS gerekmez)
    location /api/ {
        proxy_pass http://gateway-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Parmak izli derleme çıktıları: uzun süre önbelleğe alınabilir
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Ürün resimleri: olmayan dosya 404 dönmeli (arayüz renkli yedek görsele düşer).
    # Sadece resim uzantıları: /products/14 gibi arayüz rotaları SPA'ya gitmeli.
    location ~* ^/products/.+\.(jpg|jpeg|png|webp|avif|svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    # index.html asla önbelleğe alınmasın (yeni sürüm hemen görünsün)
    location = /index.html {
        expires -1;
    }

    # SPA yönlendirmesi: bilinmeyen yollar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }
}
